sonar.projectKey=mobile-wallet-verifier-certificate-signing-requests
sonar.projectName=mobile-wallet-verifier-certificate-signing-requests
sonar.organization=govuk-one-login

sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,tests/**/*,src/**/tests/utils/**,src/utils/test/**

# Only paths under sonar.sources (src) need excluding here. Root-level files
# such as build.mjs, eslint.config.ts and .npmrc are already outside the
# analysed scope. Note that build.mjs would also need sonar.language=ts
# relaxing, since that restricts analysis to TypeScript.
sonar.exclusions=**/*.test.ts,tests/**/*,src/**/tests/utils/**,src/utils/test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.language=ts
sonar.sourceEncoding=UTF-8
