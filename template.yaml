AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM application template for Verifier Certificate Authority CSRs

Parameters:
  Environment:
    Description: The environment type
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - build
      - staging
      - integration
      - prod

  CodeSigningConfigArn:
    Description: |
      The ARN of the Code Signing Config to use, provided by the deployment pipeline
    Type: String
    Default: none

  PermissionsBoundary:
    Description: |
      The ARN of the permissions boundary to apply to any role created by the template
    Type: String
    Default: none

  VpcStackName:
    Description: |
      The stack name of the VPC where Verifier CA lambdas will be deployed
    Type: String
    Default: vpc

  LambdaDeploymentPreference:
    Description: |
      Specifies the configuration to enable gradual Lambda deployments. Value can be 'AllAtOnce', a default deployment config, or name of custom DeploymentConfig.
    Type: String
    Default: AllAtOnce

  CsrRetentionDays:
    Description: Number of days to retain CSRs. Default is 1 year == 366 days (allowing for leap year)
    Type: Number
    Default: 366

Conditions:
  UsePermissionsBoundary: !Not
    - !Equals
      - !Ref PermissionsBoundary
      - none

  # Deployment preference conditions
  IsIntegrationOrProd: !Or
    - !Equals [!Ref Environment, integration]
    - !Equals [!Ref Environment, prod]

  UseCodeSigning: !Not
    - !Equals
      - !Ref CodeSigningConfigArn
      - none

  IsDevEnvironment: !Equals
    - !Ref Environment
    - dev

Mappings:
  EnvironmentVariables:
    dev:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: DEBUG

    build:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: INFO

    staging:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: INFO

    integration:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: INFO

    prod:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables
      LambdaLogLevel: INFO

Globals:
  Function:
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: !FindInMap
        - EnvironmentVariables
        - !Ref Environment
        - LambdaLogLevel
      SystemLogLevel: !FindInMap
        - EnvironmentVariables
        - !Ref Environment
        - LambdaLogLevel
    Runtime: nodejs22.x
    Architectures:
      - arm64
    PermissionsBoundary: !If
      - UsePermissionsBoundary
      - !Ref PermissionsBoundary
      - !Ref AWS::NoValue
    AutoPublishAlias: live
    CodeSigningConfigArn: !If
      - UseCodeSigning
      - !Ref CodeSigningConfigArn
      - !Ref AWS::NoValue
    DeploymentPreference:
      Enabled: !If [IsIntegrationOrProd, true, false]
      Type: !If [IsIntegrationOrProd, !Ref Linear20PercentEvery1Minute, !Ref LambdaDeploymentPreference]
      Role: !GetAtt CodeDeployServiceRole.Arn
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: mobile-wallet-verifier-certificate-signing-requests

Resources:
  CsrReceivedBucketKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CsrReceivedBucket SSE-KMS encryption
      EnableKeyRotation: true
      KeyPolicy:
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-Person1Role"
            Action:
              - kms:GenerateDataKey
              - kms:Encrypt
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-CsrReceivedBucketKmsKey"
        - Key: Service
          Value: verifier
        - Key: Environment
          Value: !Ref Environment

  CsrReceivedBucketKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-csr-received-bucket"
      TargetKeyId: !Ref CsrReceivedBucketKmsKey

  CsrValidatedBucketKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CsrValidatedBucket SSE-KMS encryption
      EnableKeyRotation: true
      KeyPolicy:
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-Person1Role"
            Action: kms:Decrypt
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-CsrValidatedBucketKmsKey"
        - Key: Service
          Value: verifier
        - Key: Environment
          Value: !Ref Environment

  CsrValidatedBucketKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-csr-validated-bucket"
      TargetKeyId: !Ref CsrValidatedBucketKmsKey

  CsrReceivedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::AccountId}-${AWS::StackName}-csr-received"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref CsrReceivedBucketKmsKey
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Sub "di-s3-access-logs-${AWS::AccountId}-${AWS::Region}"
        LogFilePrefix: "s3-access-logs/"
        TargetObjectKeyFormat:
          PartitionedPrefix:
            PartitionDateSource: EventTime
      LifecycleConfiguration:
        Rules:
          - Id: CsrRetentionPolicy
            Status: Enabled
            ExpirationInDays: !Ref CsrRetentionDays
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-CsrReceivedBucket"
        - Key: Service
          Value: verifier
        - Key: Source
          Value: govuk-one-login/mobile-wallet-verifier-ca-back/application.yaml
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Store CSRs received from external DVS organisations

  CsrValidatedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::AccountId}-${AWS::StackName}-csr-validated"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref CsrValidatedBucketKmsKey
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Sub "di-s3-access-logs-${AWS::AccountId}-${AWS::Region}"
        LogFilePrefix: "s3-access-logs/"
        TargetObjectKeyFormat:
          PartitionedPrefix:
            PartitionDateSource: EventTime
      LifecycleConfiguration:
        Rules:
          - Id: CsrRetentionPolicy
            Status: Enabled
            ExpirationInDays: !Ref CsrRetentionDays
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-CsrValidatedBucket"
        - Key: Service
          Value: verifier
        - Key: Source
          Value: govuk-one-login/mobile-wallet-verifier-ca-back/application.yaml
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Store validated CSRs

  CsrReceivedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CsrReceivedBucket
      PolicyDocument:
        Statement:
          - Effect: Deny
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-Person1Role"
            Action: s3:PutObject
            Resource:
              - !Sub "arn:aws:s3:::${CsrReceivedBucket}"
              - !Sub "arn:aws:s3:::${CsrReceivedBucket}/*"
  #         - Effect: Deny
  #           Principal:
  #             AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-Person1Role"
  #           Action: s3:PutObject
  #           Resource: !Sub "arn:aws:s3:::${CsrReceivedBucket}/*"
  #           Condition:
  #             StringNotLike:
  #               s3:prefix: "incoming/*"

  # CsrValidatedBucketPolicy:
  #   Type: AWS::S3::BucketPolicy
  #   Properties:
  #     Bucket: !Ref CsrValidatedBucket
  #     PolicyDocument:
  #       Statement:
  #         - Effect: Deny
  #           Principal:
  #             AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-Person1Role"
  #           Action:
  #             - s3:PutObject
  #             - s3:DeleteObject
  #             - s3:ListBucket
  #           Resource:
  #             - !Sub "arn:aws:s3:::${CsrValidatedBucket}"
  #             - !Sub "arn:aws:s3:::${CsrValidatedBucket}/*"
  #         - Effect: Deny
  #           Principal:
  #             AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-Person1Role"
  #           Action: s3:GetObject
  #           Resource: !Sub "arn:aws:s3:::${CsrValidatedBucket}/*"
  #           Condition:
  #             StringNotLike:
  #               s3:prefix:
  #                 - "validated/*.json"
  #                 - "failed/*.json"

  Person1Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-Person1Role"
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Person1S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${AWS::AccountId}-*-csr-received/*"
                  - !Sub "arn:aws:s3:::${AWS::AccountId}-*-csr-received"
                  - !Sub "arn:aws:s3:::${AWS::AccountId}-*-csr-validated/*"
                  - !Sub "arn:aws:s3:::${AWS::AccountId}-*-csr-validated"

        # - PolicyName: Person1S3Access
        #   PolicyDocument:
        #     Version: "2012-10-17"
        #     Statement:
        #       - Effect: Allow
        #         Action: s3:PutObject
        #         Resource: 
        #           - !Sub "arn:aws:s3:::${AWS::AccountId}-*-csr-received/incoming/*"
        #       - Effect: Allow
        #         Action: s3:GetObject
        #         Resource:
        #           - !Sub "arn:aws:s3:::${AWS::AccountId}-*-csr-validated/validated/*.json"
        #           - !Sub "arn:aws:s3:::${AWS::AccountId}-*-csr-validated/failed/*.json"
        #       - Effect: Allow
        #         Action:
        #           - kms:Encrypt
        #           - kms:GenerateDataKey
        #         Resource:
        #           - !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/*-csr-received-bucket"
        #       - Effect: Allow
        #         Action: kms:Decrypt
        #         Resource:
        #           - !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/*-csr-validated-bucket"

  Person2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-Person2Role"
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Person2S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${AWS::AccountId}-*-csr-received/*"
                  - !Sub "arn:aws:s3:::${AWS::AccountId}-*-csr-received"
                  - !Sub "arn:aws:s3:::${AWS::AccountId}-*-csr-validated/*"
                  - !Sub "arn:aws:s3:::${AWS::AccountId}-*-csr-validated"
        # - PolicyName: Person2S3Access
        #   PolicyDocument:
        #     Version: "2012-10-17"
        #     Statement:
        #       - Effect: Allow
        #         Action: s3:GetObject
        #         Resource:
        #           - !Sub "arn:aws:s3:::${AWS::AccountId}-csr-validated/validated/*.pem"
        #           - !Sub "arn:aws:s3:::${AWS::AccountId}-csr-validated/validated/*.json"
        #           - !Sub "arn:aws:s3:::${AWS::AccountId}-cert-issued/issued/*"
        #       - Effect: Allow
        #         Action: s3:ListBucket
        #         Resource:
        #           - !Sub "arn:aws:s3:::${AWS::AccountId}-csr-validated"
        #           - !Sub "arn:aws:s3:::*-certs-*-${AWS::Region}-${AWS::AccountId}"
        #         Condition:
        #           StringLike:
        #             s3:prefix:
        #               - validated/
        #               - issued/
        #       - Effect: Allow
        #         Action: kms:Decrypt
        #         Resource:
        #           - !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/${AWS::StackName}-csr-validated-bucket"

Outputs:
  CsrReceivedBucketKmsKeyArn:
    Description: ARN of the KMS key used for CsrReceivedBucket encryption
    Value: !GetAtt CsrReceivedBucketKmsKey.Arn

  CsrReceivedBucketName:
    Description: Name of the S3 bucket to store CSRs received from external DVS organisations
    Value: !Ref CsrReceivedBucket

  CsrValidatedBucketName:
    Description: Name of the S3 bucket which has validated CSRs
    Value: !Ref CsrValidatedBucket
