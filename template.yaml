AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM application template for Verifier Certificate Authority CSRs

Parameters:
  Environment:
    Description: The environment type
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - build
      - staging
      - integration
      - prod

  CodeSigningConfigArn:
    Description: |
      The ARN of the Code Signing Config to use, provided by the deployment pipeline
    Type: String
    Default: none

  PermissionsBoundary:
    Description: |
      The ARN of the permissions boundary to apply to any role created by the template
    Type: String
    Default: none

  VpcStackName:
    Description: |
      The stack name of the VPC where Verifier CA lambdas will be deployed
    Type: String
    Default: vpc

  IntCaBackendStackName:
    Description: |
      The stack name of the Int CA backend where certificates issued bucket is deployed
    Type: String
    Default: dvs-ca

  LambdaDeploymentPreference:
    Description: |
      Specifies the configuration to enable gradual Lambda deployments. Value can be 'AllAtOnce', a default deployment config, or name of custom DeploymentConfig.
    Type: String
    Default: AllAtOnce

  CsrRetentionDays:
    Description: Number of days to retain CSRs. Default is 1 year == 366 days (allowing for leap year)
    Type: Number
    Default: 366

Conditions:
  UsePermissionsBoundary: !Not
    - !Equals
      - !Ref PermissionsBoundary
      - none

  # Deployment preference conditions
  IsIntegrationOrProd: !Or
    - !Equals [!Ref Environment, integration]
    - !Equals [!Ref Environment, prod]

  UseCodeSigning: !Not
    - !Equals
      - !Ref CodeSigningConfigArn
      - none

Mappings:
  EnvironmentVariables:
    dev:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: DEBUG

    build:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: INFO

    staging:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: INFO

    integration:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: INFO

    prod:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables
      LambdaLogLevel: INFO

Globals:
  Function:
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: !FindInMap
        - EnvironmentVariables
        - !Ref Environment
        - LambdaLogLevel
      SystemLogLevel: !FindInMap
        - EnvironmentVariables
        - !Ref Environment
        - LambdaLogLevel
    Runtime: nodejs22.x
    Architectures:
      - arm64
    PermissionsBoundary: !If
      - UsePermissionsBoundary
      - !Ref PermissionsBoundary
      - !Ref AWS::NoValue
    AutoPublishAlias: live
    DeploymentPreference:
      Enabled: !If [IsIntegrationOrProd, true, false]
      Type: !If [IsIntegrationOrProd, !Ref Linear20PercentEvery1Minute, !Ref LambdaDeploymentPreference]
      Role: !GetAtt CodeDeployServiceRole.Arn

Resources:
  CsrReceivedBucketKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CsrReceivedBucket SSE-KMS encryption
      EnableKeyRotation: true
      KeyPolicy:
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-CsrReceivedBucketKmsKey"
        - Key: Service
          Value: verifier
        - Key: Environment
          Value: !Ref Environment

  CsrReceivedBucketKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-csr-received-bucket"
      TargetKeyId: !Ref CsrReceivedBucketKmsKey

  CsrValidatedBucketKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CsrValidatedBucket SSE-KMS encryption
      EnableKeyRotation: true
      KeyPolicy:
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-CsrValidatedBucketKmsKey"
        - Key: Service
          Value: verifier
        - Key: Environment
          Value: !Ref Environment

  CsrValidatedBucketKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-csr-validated-bucket"
      TargetKeyId: !Ref CsrValidatedBucketKmsKey

  CsrReceivedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - CsrValidatorFunctionS3InvokePermission
    Properties:
      BucketName: !Sub "${AWS::AccountId}-${AWS::StackName}-csr-received"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref CsrReceivedBucketKmsKey
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !Ref CsrValidatorFunction.Alias
      LoggingConfiguration:
        DestinationBucketName: !Sub "di-s3-access-logs-${AWS::AccountId}-${AWS::Region}"
        LogFilePrefix: "s3-access-logs/"
        TargetObjectKeyFormat:
          PartitionedPrefix:
            PartitionDateSource: EventTime
      LifecycleConfiguration:
        Rules:
          - Id: CsrRetentionPolicy
            Status: Enabled
            ExpirationInDays: !Ref CsrRetentionDays
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-CsrReceivedBucket"
        - Key: Service
          Value: verifier
        - Key: Source
          Value: govuk-one-login/mobile-wallet-verifier-ca-back/application.yaml
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Store CSRs received from external DVS organisations

  CsrValidatedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::AccountId}-${AWS::StackName}-csr-validated"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref CsrValidatedBucketKmsKey
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Sub "di-s3-access-logs-${AWS::AccountId}-${AWS::Region}"
        LogFilePrefix: "s3-access-logs/"
        TargetObjectKeyFormat:
          PartitionedPrefix:
            PartitionDateSource: EventTime
      LifecycleConfiguration:
        Rules:
          - Id: CsrRetentionPolicy
            Status: Enabled
            ExpirationInDays: !Ref CsrRetentionDays
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-CsrValidatedBucket"
        - Key: Service
          Value: verifier
        - Key: Source
          Value: govuk-one-login/mobile-wallet-verifier-ca-back/application.yaml
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Store validated CSRs

  L3EnableDisableOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-L3EnableDisableOperatorRole"
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalARN:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_AdministratorAccessPermission*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_ApprovedMobWalletCAEnableDisable*"
      Policies:
        - PolicyName: L3EnableDisableOperatorS3AccessReceivedBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${CsrReceivedBucket}/*"
        - PolicyName: L3EnableDisableOperatorKMSAccessReceivedBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource:
                  - !GetAtt CsrReceivedBucketKmsKey.Arn
        - PolicyName: L3EnableDisableOperatorAccessValidatedBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  - !GetAtt CsrValidatedBucketKmsKey.Arn
        - PolicyName: L3EnableDisableOperatorS3ListReceivedAndValidatedBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${CsrReceivedBucket}"
                  - !Sub "arn:aws:s3:::${CsrValidatedBucket}"

  L3IssueRevokeOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-L3IssueRevokeOperatorRole"
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalARN:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_AdministratorAccessPermission*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_ApprovedMobWalletCAIssueRevoke*"
      Policies:
        - PolicyName: L3IssueRevokeOperatorAccessValidatedBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  - !GetAtt CsrValidatedBucketKmsKey.Arn
        - PolicyName: L3IssueRevokeOperatorS3ListReceivedAndValidatedBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${CsrReceivedBucket}"
                  - !Sub "arn:aws:s3:::${CsrValidatedBucket}"
        - PolicyName: L3IssueRevokeOperatorS3PutIntoCertsBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub
                  - "arn:aws:s3:::${BucketName}/issued/*"
                  - BucketName: !ImportValue
                      Fn::Sub: "${IntCaBackendStackName}-IssuedCertsBucketName"
        - PolicyName: L3IssueRevokeOperatorS3ListCertsBucketCertPrefix
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub
                  - "arn:aws:s3:::${BucketName}"
                  - BucketName: !ImportValue
                      Fn::Sub: "${IntCaBackendStackName}-IssuedCertsBucketName"
                Condition:
                  StringLike:
                    s3:prefix: "issued/"

  Linear20PercentEvery1Minute:
    Type: AWS::CodeDeploy::DeploymentConfig
    Properties:
      ComputePlatform: Lambda
      DeploymentConfigName: !Sub ${AWS::StackName}-Linear20PercentEvery1Minute
      TrafficRoutingConfig:
        TimeBasedLinear:
          LinearInterval: 1
          LinearPercentage: 20
        Type: TimeBasedLinear

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - codedeploy.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda
      PermissionsBoundary: !If [UsePermissionsBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue]

  CsrValidatorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: KMS encryption not required for Lambda log group
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-csr-validator
      RetentionInDays: 30

  CsrValidatorFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-CsrValidatorFunctionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: CsrValidatorS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::AccountId}-${AWS::StackName}-csr-received/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${AWS::AccountId}-${AWS::StackName}-csr-validated/*"
        - PolicyName: CsrValidatorKmsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt CsrReceivedBucketKmsKey.Arn
              - Effect: Allow
                Action: kms:GenerateDataKey
                Resource: !GetAtt CsrValidatedBucketKmsKey.Arn
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue

  CsrValidatorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/lambdas/csr-validator/handler.ts
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Concurrency limit not required for this function
          - id: CKV_AWS_173
            comment: >-
              Environment variable holds only the validated-bucket name, which
              is not sensitive
    Properties:
      FunctionName: !Sub "${AWS::StackName}-csr-validator"
      CodeUri: ./
      Handler: handler.handler
      Timeout: 30
      MemorySize: 512
      CodeSigningConfigArn: !If
        - UseCodeSigning
        - !Ref CodeSigningConfigArn
        - !Ref AWS::NoValue
      Role: !GetAtt CsrValidatorFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref CsrValidatorFunctionLogGroup
      Environment:
        Variables:
          CSR_VALIDATED_BUCKET: !Ref CsrValidatedBucket
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub ${VpcStackName}-AWSServicesEndpointSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnetIdA
          - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnetIdB
          - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnetIdC

  CsrValidatorFunctionS3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CsrValidatorFunction.Alias
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${AWS::AccountId}-${AWS::StackName}-csr-received"

Outputs:
  CsrReceivedBucketKmsKeyArn:
    Description: ARN of the KMS key used for CsrReceivedBucket encryption
    Value: !GetAtt CsrReceivedBucketKmsKey.Arn

  CsrReceivedBucketName:
    Description: Name of the S3 bucket to store CSRs received from external DVS organisations
    Value: !Ref CsrReceivedBucket

  CsrValidatedBucketName:
    Description: Name of the S3 bucket which has validated CSRs
    Value: !Ref CsrValidatedBucket
