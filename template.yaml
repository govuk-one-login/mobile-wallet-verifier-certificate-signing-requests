AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM application template for Verifier Certificate Authority backend

Parameters:
  Environment:
    Description: The environment type
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - build
      - staging
      - integration
      - prod

  BaseAppStack:
    Description: |
      Name of the base-application stack (for CloudFormation imports).
      Defaults to 'ca-base' or 'ca-base-pr-{pr-number}'.
    Type: String
    Default: 'ca-base'

  CodeSigningConfigArn:
    Description: |
      The ARN of the Code Signing Config to use, provided by the deployment pipeline
    Type: String
    Default: none

  PermissionsBoundary:
    Description: |
      The ARN of the permissions boundary to apply to any role created by the template
    Type: String
    Default: none

  VpcStackName:
    Description: |
      The stack name of the VPC where Verifier CA lambdas will be deployed
    Type: String
    Default: vpc

  CaBackendApiParam:
    Description: |
      The backend Api prefix url
    Type: String
    Default: ca-backend-api

  EnableMonitoring:
    Description: |
      Whether to create CloudWatch alarms and SNS topics for monitoring.
      Set to 'false' for feature branch deployments to avoid SNS topic name conflicts.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  LambdaDeploymentPreference:
    Description: |
      Specifies the configuration to enable gradual Lambda deployments. Value can be 'AllAtOnce', a default deployment config, or name of custom DeploymentConfig.
    Type: String
    Default: AllAtOnce

  CsrRetentionDays:
    Description: Number of days to retain CSRs. Default is 1 year == 366 days (allowing for leap year)
    Type: Number
    Default: 366

Conditions:
  UsePermissionsBoundary: !Not
    - !Equals
      - !Ref PermissionsBoundary
      - none

  # Deployment preference conditions
  IsIntegrationOrProd: !Or
    - !Equals [!Ref Environment, integration]
    - !Equals [!Ref Environment, prod]

  UseCodeSigning: !Not
    - !Equals
      - !Ref CodeSigningConfigArn
      - none

  IsDevEnvironment: !Equals
    - !Ref Environment
    - dev

  CreateMonitoringResources: !Equals
    - !Ref EnableMonitoring
    - 'true'

  CreateAlarmsAndMonitoring: !And
    - !Condition IsIntegrationOrProd
    - !Condition CreateMonitoringResources

Mappings:
  EnvironmentVariables:
    dev:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: DEBUG

    build:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: INFO

    staging:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: INFO

    integration:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      LambdaLogLevel: INFO

    prod:
      DynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables
      LambdaLogLevel: INFO

    CslsEgress:
      build: arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython-2
      integration: arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython-2
      prod: arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython-2
      staging: arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython-2

Globals:
  Function:
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: !FindInMap
        - EnvironmentVariables
        - !Ref Environment
        - LambdaLogLevel
      SystemLogLevel: !FindInMap
        - EnvironmentVariables
        - !Ref Environment
        - LambdaLogLevel
    Runtime: nodejs22.x
    Architectures:
      - arm64
    PermissionsBoundary: !If
      - UsePermissionsBoundary
      - !Ref PermissionsBoundary
      - !Ref AWS::NoValue
    AutoPublishAlias: live
    CodeSigningConfigArn: !If
      - UseCodeSigning
      - !Ref CodeSigningConfigArn
      - !Ref AWS::NoValue
    DeploymentPreference:
      Enabled: !If [IsIntegrationOrProd, true, false]
      Type: !If [IsIntegrationOrProd, !Ref Linear20PercentEvery1Minute, !Ref LambdaDeploymentPreference]
      Role: !GetAtt CodeDeployServiceRole.Arn
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: mobile-wallet-verifier-certificate-signing-requests

Resources:
  # ========================================
  # PRODUCTION SERVICES
  # ========================================

  # Customer-managed KMS key for SNS encryption with CloudWatch permissions
  WarningsChannelKMSKey:
    Type: AWS::KMS::Key
    Condition: CreateMonitoringResources
    Properties:
      Description: KMS key for SNS topic encryption with CloudWatch access
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow CloudWatch to use the key
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: '*'

  WarningsChannel:
    Type: AWS::SNS::Topic
    Condition: CreateMonitoringResources
    Properties:
      TopicName: !Sub '${AWS::StackName}-warnings'
      DisplayName: !Sub '${AWS::StackName} Warnings'
      KmsMasterKeyId: !Ref WarningsChannelKMSKey

  WarningsChannelPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CreateMonitoringResources
    Properties:
      Topics:
        - !Ref WarningsChannel
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - sns:Publish
            Resource: !Ref WarningsChannel
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - codedeploy.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda
      PermissionsBoundary: !If [UsePermissionsBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue]

  # Custom Deployment Config
  Linear20PercentEvery1Minute:
    Type: AWS::CodeDeploy::DeploymentConfig
    Properties:
      ComputePlatform: Lambda
      DeploymentConfigName: !Sub ${AWS::StackName}-Linear20PercentEvery1Minute
      TrafficRoutingConfig:
        TimeBasedLinear:
          LinearInterval: 1
          LinearPercentage: 20
        Type: TimeBasedLinear

  CsrReceivedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::AccountId}-${AWS::StackName}-csr-received"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Sub "di-s3-access-logs-${AWS::AccountId}-${AWS::Region}"
        LogFilePrefix: "s3-access-logs/"
        TargetObjectKeyFormat:
          PartitionedPrefix:
            PartitionDateSource: EventTime
      LifecycleConfiguration:
        Rules:
          - Id: CsrRetentionPolicy
            Status: Enabled
            ExpirationInDays: !Ref CsrRetentionDays
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-CsrReceivedBucket"
        - Key: Service
          Value: verifier
        - Key: Source
          Value: govuk-one-login/mobile-wallet-verifier-ca-back/application.yaml
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Store CSRs received from external DVS organisations

  CsrValidatedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::AccountId}-${AWS::StackName}-csr-validated"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Sub "di-s3-access-logs-${AWS::AccountId}-${AWS::Region}"
        LogFilePrefix: "s3-access-logs/"
        TargetObjectKeyFormat:
          PartitionedPrefix:
            PartitionDateSource: EventTime
      LifecycleConfiguration:
        Rules:
          - Id: CsrRetentionPolicy
            Status: Enabled
            ExpirationInDays: !Ref CsrRetentionDays
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-CsrValidatedBucket"
        - Key: Service
          Value: verifier
        - Key: Source
          Value: govuk-one-login/mobile-wallet-verifier-ca-back/application.yaml
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Store validated CSRs

Outputs:
  CsrReceivedBucketName:
    Description: Name of the S3 bucket to store CSRs received from external DVS organisations
    Value: !Ref CsrReceivedBucket
    Export:
      Name: !Sub "${AWS::StackName}-CsrReceivedBucketName"
  CsrValidatedBucketName:
    Description: Name of the S3 bucket which has validated CSRs
    Value: !Ref CsrValidatedBucket
