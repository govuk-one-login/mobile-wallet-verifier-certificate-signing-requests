name: Quality Checks

on:
  workflow_call:
    inputs:
      RUN_SONARQUBE:
        description: Whether to run SonarQube checks.
        type: string
        default: "true"
      SONARQUBE_CONTINUE_ON_ERROR:
        description: Whether to continue running the workflow if SonarQube quality gate fails
        type: string
        default: "false"
      WORKING_DIRECTORY:
        description: Path to working directory in repo
        required: true
        type: string

permissions:
  packages: read
  id-token: write
  contents: read
  pull-requests: write

jobs:
  ci-checks:
    name: Run CI checks
    runs-on: ubuntu-24.04
    env:
      SAM_CLI_TELEMETRY: 0
      CONTINUE_ON_ERROR: ${{ inputs.SONARQUBE_CONTINUE_ON_ERROR }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        if: inputs.RUN_SONARQUBE == 'true' && github.actor != 'dependabot[bot]'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version-file: .nvmrc

      - name: Install dependencies
        if: inputs.RUN_SONARQUBE == 'true' && github.actor != 'dependabot[bot]'
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        if: inputs.RUN_SONARQUBE == 'true' && github.actor != 'dependabot[bot]'
        run: npm test -- --coverage

      - name: Run SonarQube Scan
        if: inputs.RUN_SONARQUBE == 'true' && github.actor != 'dependabot[bot]'
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run SonarQube Quality Gate Check
        if: inputs.RUN_SONARQUBE == 'true' && github.actor != 'dependabot[bot]'
        uses: Sonarsource/sonarqube-quality-gate-action@8406f4f1edaffef38e9fb9c53eb292fc1d7684fa # v6.0.0
        continue-on-error: ${{ fromJSON(env.CONTINUE_ON_ERROR) }}
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

